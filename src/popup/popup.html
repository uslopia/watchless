<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Watchless</title>
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="../styles/popup.css" />
  </head>
  <body>
    <header>
      <span class="wordmark">Watchless</span>
      <div role="tablist" aria-label="Watchless">
        <button
          type="button"
          role="tab"
          id="tab-history"
          aria-controls="panel-history"
          aria-selected="true"
          data-i18n="tab_history"
        ></button>
        <button
          type="button"
          role="tab"
          id="tab-settings"
          aria-controls="panel-settings"
          aria-selected="false"
          data-i18n="tab_settings"
        ></button>
      </div>
    </header>

    <section id="panel-history" role="tabpanel" aria-labelledby="tab-history">
      <div class="counter">
        <output id="total">00:00:00</output>
        <p><span data-i18n="counter_label"></span> · <span id="count"></span></p>
      </div>

      <div class="search">
        <input
          id="search"
          type="search"
          autocomplete="off"
          data-i18n-placeholder="search_placeholder"
        />
      </div>

      <ul id="list"></ul>
      <p id="empty" hidden></p>
    </section>

    <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <label class="field">
        <span data-i18n="settings_lang"></span><select id="lang"></select>
      </label>

      <label class="field">
        <span data-i18n="settings_autoexport"></span><select id="autoExport">
          <option value="off" data-i18n="settings_autoexport_off"></option>
          <option value="obsidian" data-i18n="settings_autoexport_obsidian"></option>
          <option value="download" data-i18n="settings_autoexport_download"></option>
        </select>
      </label>

      <h2 data-i18n="settings_preset"></h2>
      <label class="field">
        <select id="preset"></select>
        <small data-i18n="settings_preset_hint"></small>
      </label>

      <h2 data-i18n="settings_obsidian"></h2>
      <label class="field">
        <span data-i18n="settings_vault"></span
        ><input id="vault" placeholder="MyVault" autocomplete="off" />
      </label>
      <label class="field">
        <span data-i18n="settings_folder"></span><input id="folder" placeholder="Youtube" autocomplete="off" />
        <small data-i18n="settings_folder_hint"></small>
      </label>

      <h2 data-i18n="settings_danger"></h2>
      <button id="clear" type="button" class="btn danger" data-i18n="settings_clear"></button>

      <h2 data-i18n="model_status"></h2>
      <div id="model"></div>

      <h2 data-i18n="settings_perf"></h2>
      <label class="field">
        <span data-i18n="settings_concurrency"></span><select id="concurrency">
          <option value="auto" data-i18n="settings_concurrency_auto"></option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
        <small data-i18n="settings_concurrency_hint"></small>
      </label>
      <label class="check"
        ><input type="checkbox" id="prewarm" /><span data-i18n="settings_prewarm_hint"></span
      ></label>

      <h2 data-i18n="settings_debug"></h2>
      <label class="check"
        ><input type="checkbox" id="debug" /><span data-i18n="settings_debug_hint"></span
      ></label>
      <div id="debug-log" hidden></div>

      <p id="saved" role="status" aria-live="polite"></p>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
